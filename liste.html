<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liste des Boissons</title>
<style>
body { font-family: Arial, sans-serif; margin:0; padding:0; background:#f2f2f2;}
header { background:#4CAF50; color:white; padding:20px; text-align:center;}
nav a { margin:0 15px; color:white; text-decoration:none; font-weight:bold;}
table { width:100%; border-collapse: collapse; margin:20px 0; }
table, th, td { border:1px solid #ddd; }
th, td { padding:10px; text-align:left; }
th { background:#4CAF50; color:white; }
tr:nth-child(even){ background:#f9f9f9; }
button { padding:5px 10px; background:#f44336; color:white; border:none; cursor:pointer; }
button:hover { background:#da190b; }
</style>
</head>
<body>
<header>
<h1>Liste des Boissons</h1>
<nav>
<a href="index.html">Accueil</a>
<a href="liste.html">Liste des boissons</a>
<a href="ajouter.html">Ajouter boisson</a>
<a href="gestion.html">Gestion stock</a>
<a href="rapports.html">Rapports</a>
</nav>
</header>
<section>
<table id="boissonsTable">
<tr>
<th>Nom</th>
<th>Quantité</th>
<th>Prix Unitaire (USD)</th>
<th>Actions</th>
</tr>
<!-- Exemple de boisson -->
<tr>
<td>Coca-Cola</td>
<td>50</td>
<td>1.5</td>
<td><button onclick="supprimer(this)">Supprimer</button></td>
</tr>
<tr>
<td>Fanta</td>
<td>30</td>
<td>1.2</td>
<td><button onclick="supprimer(this)">Supprimer</button></td>
</tr>
</table>
</section>
<footer>
<p>&copy; 2026 Dépôt de Boissons</p>
</footer>
<script>
function supprimer(btn){
  const row = btn.parentNode.parentNode;
  row.parentNode.removeChild(row);
}
</script>
</body>
</html>
